# Compilează aplicația Android pe un calculator GitHub (are deja Android SDK)
# și publică EnduroFleet.apk la Releases -> latest, ca să-l instalezi direct pe telefon.
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EnduroFleet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EnduroFleet-apk
          path: EnduroFleet.apk

      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EnduroFleet.apk \
            --target "$GITHUB_SHA" \
            --title "EnduroFleet (latest build)" \
            --notes "Debug build of $GITHUB_SHA. Download EnduroFleet.apk on the phone and install it."
